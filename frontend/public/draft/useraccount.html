<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            width: 465px;
            height: 1080px;
            position: absolute;
            background: #471C1A;
            top: 0;
            left: 0;
        }
        .menu-text {
            width: 192px;
            height: 34px;
            position: absolute;
            left: 48px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-size: 32px;
            font-weight: 400;
            word-wrap: break-word;
        }
        .profile { top: 308px; }
        .setting { top: 386px; }
        .contact { top: 462px; }
        .logout { top: 538px; }

        .background-rotate {
            width: 1455px;
            height: 1080px;
            position: absolute;
            left: 1920px;
            top: 1080px;
            background: #6A3C3A;
            transform: rotate(180deg);
            transform-origin: top left;
        }
        .icon-container {
            width: 48px;
            height: 48px;
            position: absolute;
            left: 48px;
            top: 48px;
            overflow: hidden;
        }
        .icon-inner {
            width: 28px;
            height: 28px;
            position: absolute;
            left: 10px;
            top: 10px;
            outline: 4px var(--Color-2, white) solid;
            outline-offset: -2px;
        }
        .profile-pic {
            width: 190px;
            height: 190px;
            position: absolute;
            left: 137px;
            top: 81px;
        }
        .profile-pic-inner {
            width: 158.33px;
            height: 158.33px;
            position: absolute;
            left: 15.83px;
            top: 15.83px;
            background: white;
        }
        .line {
            width: 370px;
            height: 0px;
            position: absolute;
            left: 47px;
            outline: 1px white solid;
            outline-offset: -0.5px;
        }
        .line1 { top: 364px; }
        .line2 { top: 440px; }
        .line3 { top: 518px; }
        .line4 { top: 594px; }
    </style>
</head>
<body>
    <div class="sidebar"></div>

    <div class="menu-text profile">Profile</div>
    <div class="menu-text setting">Setting</div>
    <div class="menu-text contact">Contact us</div>
    <div class="menu-text logout">Log out</div>

    <div class="background-rotate"></div>

    <div class="icon-container">
        <div class="icon-inner"></div>
    </div>

    <div class="profile-pic">
        <div class="profile-pic-inner"></div>
    </div>

    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>

    <script>
        // ถ้ามี script เพิ่มเติมสามารถเขียนได้ที่นี่
        // ตอนนี้ไม่มีฟังก์ชันอะไรในไฟล์ต้นฉบับ เลยยังไม่ต้องใส่อะไร
    </script>
</body>
</html>
