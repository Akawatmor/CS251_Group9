<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>user account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <div class="layout">
        <aside class="sidebar">
          <div class="logo"><a href="#">&#8592;</a></div>
          <img src="https://placehold.co/30x30" alt="Profile Icon" class="profile-icon">
          <div class="tags">
            <a href="#">1</a><hr>

          </div>
        </aside>
      </div> 
    
</body>

<style>

body, html {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  height: 100%;
  background: linear-gradient(270deg, #471C1A 32%, #9F3E3A 70%, #C9A24E 99%);
}

.layout {
  display: flex;
  height: 100vh;
}

.sidebar {
  background: linear-gradient(180deg, #350B09 67%, #471C1A 100%);
  color: white;
  width: 250px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.logo {
  font-size: 32px;
}

.sidebar hr {
  border: 0;
  border-top: 1px solid white;
  margin: 10px 0;
}

.sidebar h2 {
  font-size: 20px;
}
.sidebar a {
  text-decoration: none;
  color: white;
}
.tags label {
  display: block;
  margin-top: 10px;
  font-size: 16px;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: url('https://i.ibb.co/7z1RVtk/dots-bg.png') no-repeat center/cover;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #230706;
  color: white;
  padding: 0 30px;
  height: 60px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 15px;
}

.nav-links a {
  text-decoration: none;
  color: white;
  font-size: 20px;
}

.account {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero {
  background-color: rgba(255, 255, 255, 0.1);
  margin: 20px;
  height: 250px;
  border-radius: 8px;
}

.search-section {
  display: flex;
  align-items: center;
  margin: 0 20px 20px 20px;
}

.search-section input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

.search-section button {
  padding: 10px 15px;
  font-size: 20px;
  background-color: #471C1A;
  color: white;
  border: none;
  cursor: pointer;
}

.cards {
  display: flex;
  gap: 20px;
  margin: 0 20px;
}

.card {
  flex: 1;
  background-color: rgba(255, 255, 255, 0.1);
  height: 200px;
  border-radius: 8px;
}
.profile-icon {
    width: 30%;
    align-self: center;
  }
</style>
