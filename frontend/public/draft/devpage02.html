<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Zip Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: white;
        }
        .background-left {
            width: 465px;
            height: 1080px;
            position: absolute;
            left: 0;
            top: 0;
            background: #471C1A;
        }
        .background-right {
            width: 1455px;
            height: 1080px;
            position: absolute;
            left: 1920px;
            top: 1080px;
            transform: rotate(180deg);
            transform-origin: top left;
            background: #6A3C3A;
        }
        .header-bar {
            width: 545px;
            height: 79px;
            position: absolute;
            left: 522px;
            top: 152px;
            background: #471C1A;
        }
        .header-text {
            width: 192px;
            height: 95px;
            position: absolute;
            left: 522px;
            top: 57px;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
            word-wrap: break-word;
        }
        .checkbox {
            width: 48px;
            height: 48px;
            position: absolute;
            left: 48px;
            top: 48px;
            overflow: hidden;
        }
        .checkbox-inner {
            width: 28px;
            height: 28px;
            position: absolute;
            left: 10px;
            top: 10px;
            outline: 4px white solid;
            outline-offset: -2px;
        }
        .menu-item {
            width: 232px;
            height: 34px;
            position: absolute;
            left: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
            word-wrap: break-word;
        }
        .store { top: 145px; }
        .game { top: 223px; }
        .pricing { top: 299px; }
        .contact { width: 192px; top: 375px; }
        .divider {
            width: 370px;
            height: 0px;
            position: absolute;
            left: 47px;
            outline: 1px white solid;
            outline-offset: -0.5px;
        }
        .divider1 { top: 201px; }
        .divider2 { top: 277px; }
        .divider3 { top: 355px; }
        .divider4 { top: 431px; }
        .apply-bar {
            width: 329px;
            height: 79px;
            position: absolute;
            left: 1526px;
            top: 936px;
            background: #471C1A;
        }
        .apply-text {
            width: 192px;
            height: 95px;
            position: absolute;
            left: 1594px;
            top: 928px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="background-left"></div>
    <div class="background-right"></div>

    <div class="header-bar"></div>
    <div class="header-text">upload zip game</div>

    <div class="checkbox">
        <div class="checkbox-inner"></div>
    </div>

    <div class="menu-item store">Store</div>
    <div class="divider divider1"></div>

    <div class="menu-item game">Game</div>
    <div class="divider divider2"></div>

    <div class="menu-item pricing">Pricing</div>
    <div class="divider divider3"></div>

    <div class="menu-item contact">Contract us</div>
    <div class="divider divider4"></div>

    <div class="apply-bar"></div>
    <div class="apply-text">apply</div>

</body>
</html>
