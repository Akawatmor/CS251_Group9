<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single File Layout</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: white;
            position: relative;
        }
        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .sidebar {
            width: 465px;
            height: 1080px;
            position: absolute;
            left: 0;
            top: 0;
            background: #471C1A;
        }
        .background {
            width: 1455px;
            height: 1080px;
            position: absolute;
            left: 1920px;
            top: 1080px;
            transform: rotate(180deg);
            transform-origin: top left;
            background: #6A3C3A;
        }
        .upload-box, .description-box {
            width: 1297px;
            height: 304px;
            position: absolute;
            background: #471C1A;
        }
        .upload-box {
            left: 544px;
            top: 77px;
        }
        .description-box {
            left: 544px;
            top: 453px;
        }
        .upload-text, .description-text, .menu, .apply-text {
            position: absolute;
            color: white;
            font-size: 32px;
            font-weight: 400;
            word-wrap: break-word;
        }
        .upload-text {
            width: 192px;
            height: 95px;
            left: 640px;
            top: 182px;
        }
        .description-text {
            width: 192px;
            height: 95px;
            left: 640px;
            top: 558px;
        }
        .logo {
            width: 48px;
            height: 48px;
            position: absolute;
            left: 48px;
            top: 48px;
            overflow: hidden;
        }
        .logo-inner {
            width: 28px;
            height: 28px;
            position: absolute;
            left: 10px;
            top: 10px;
            outline: 4px white solid;
            outline-offset: -2px;
        }
        .menu {
            width: 232px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .store {
            left: 48px;
            top: 145px;
        }
        .game {
            left: 48px;
            top: 223px;
        }
        .pricing {
            left: 48px;
            top: 299px;
        }
        .contact {
            left: 48px;
            top: 375px;
        }
        .line {
            width: 370px;
            height: 0px;
            position: absolute;
            outline: 1px white solid;
            outline-offset: -0.5px;
        }
        .line1 { top: 201px; left: 47px; }
        .line2 { top: 277px; left: 47px; }
        .line3 { top: 355px; left: 47px; }
        .line4 { top: 431px; left: 47px; }
        .apply-button {
            width: 329px;
            height: 79px;
            position: absolute;
            left: 1526px;
            top: 936px;
            background: #471C1A;
        }
        .apply-text {
            width: 192px;
            height: 95px;
            position: absolute;
            left: 1594px;
            top: 928px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="sidebar"></div>
        <div class="background"></div>

        <div class="upload-box"></div>
        <div class="upload-text">upload picture</div>

        <div class="description-box"></div>
        <div class="description-text">discription and tag</div>

        <div class="logo">
            <div class="logo-inner"></div>
        </div>

        <div class="menu store">Store</div>
        <div class="menu game">Game</div>
        <div class="menu pricing">Pricing</div>
        <div class="menu contact">Contract us</div>

        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
        <div class="line line4"></div>

        <div class="apply-button"></div>
        <div class="apply-text">apply</div>
    </div>

    <script>
        // JavaScript (ถ้ามี เพิ่มตรงนี้ได้เลย)
    </script>

</body>
</html>
