            background: #6A3C3A;

        .divider1 { left: 465px; top: 143px; }
        .divider2 { left: 779px; top: 143px; }
        .divider3 { left: 971px; top: 143px; }

            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
            word-wrap: break-word;
        }

            font-size: 24px;

            word-wrap: break-word;

            height: 28px;

            top: 22px;
            position: absolute;
            border-radius: 6px;
            border: 4px white solid;
