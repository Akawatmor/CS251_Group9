<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Separated Layout</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: white;
        }
        .background-gradient {
            width: 1920px;
            height: 1080px;
            position: absolute;
            background: linear-gradient(180deg, #350B09 0%, #3D1210 35%, #A6504C 77%, #CEAA5F 99%);
        }
        .rotated-image {
            width: 2113.2px;
            height: 2113.2px;
            position: absolute;
            left: 1990.58px;
            top: -520.44px;
            transform: rotate(92deg);
            transform-origin: top left;
        }
        .bottom-block {
            width: 1274px;
            height: 1080px;
            position: absolute;
            left: 1597px;
            top: 1080px;
            transform: rotate(180deg);
            transform-origin: top left;
            background: #471C1A;
        }
        .qr-box {
            width: 400px;
            height: 400px;
            position: absolute;
            left: 431px;
            top: 340px;
            background: #BEBEBE;
        }
        .qr-text {
            width: 116px;
            height: 51px;
            position: absolute;
            left: 573px;
            top: 489px;
            color: black;
            font-size: 64px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
        }
        .header-top {
            width: 1920px;
            height: 157px;
            position: absolute;
            top: 0;
            background: #230706;
        }
        .header-bottom {
            width: 1920px;
            height: 84px;
            position: absolute;
            top: 73px;
            background: #350B09;
        }
        .menu-outline {
            width: 34px;
            height: 28px;
            position: absolute;
            left: 1805px;
            top: 22px;
            border-radius: 6px;
            border: 4px white solid;
        }
        .menu-icon {
            width: 48px;
            height: 48px;
            position: absolute;
            overflow: hidden;
        }
        .menu-icon.small {
            left: 1742px;
            top: 12px;
        }
        .menu-icon.large {
            left: 1855px;
            top: 12px;
        }
        .menu-icon.large div {
            width: 24px;
            height: 24px;
            position: absolute;
            left: 12px;
            top: 12px;
            outline: 4px white solid;
            outline-offset: -2px;
        }
        .nav-text {
            position: absolute;
            text-align: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
            height: 34px;
        }
        .homepage {
            width: 192px;
            left: 91px;
            top: 93px;
        }
        .library {
            width: 192px;
            left: 344px;
            top: 94px;
        }
        .account-top {
            width: 192px;
            left: 1728px;
            top: 93px;
        }
        .separator-line {
            width: 56px;
            height: 0;
            position: absolute;
            transform: rotate(-90deg);
            transform-origin: top left;
            outline: 1px white solid;
            outline-offset: -0.5px;
        }
        .line-1 { left: 30px; top: 143px; }
        .line-2 { left: 344px; top: 143px; }
        .line-3 { left: 536px; top: 143px; }
        .account-block {
            width: 545px;
            height: 79px;
            position: absolute;
            background: #6A3C3A;
        }
        .account-top-block {
            top: 442px;
            left: 899px;
        }
        .account-bottom-block {
            top: 618px;
            left: 899px;
        }
        .account-title {
            position: absolute;
            width: 192px;
            height: 34px;
            top: 384px;
            left: 899px;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
        }
        .choose-text {
            width: 192px;
            height: 34px;
            position: absolute;
            left: 826px;
            top: 250px;
            text-align: center;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
        }
        .slip-text {
            width: 192px;
            height: 34px;
            position: absolute;
            left: 919px;
            top: 640px;
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: white;
            font-size: 32px;
            font-family: Poppins, sans-serif;
            font-weight: 400;
        }
        .profile-pic {
            width: 52px;
            height: 52px;
            position: absolute;
            left: 1691px;
            top: 84px;
        }
        .profile-pic img {
            width: 43.33px;
            height: 43.33px;
            position: absolute;
            left: 4.33px;
            top: 4.33px;
            background: var(--Slate-200, #E3E3E3);
        }
    </style>
</head>
<body>

<div class="background-gradient"></div>
<img class="rotated-image" src="https://placehold.co/2113x2113" />
<div class="bottom-block"></div>

<div class="qr-box"></div>
<div class="qr-text">QR</div>

<div class="header-top"></div>
<div class="header-bottom"></div>

<div class="menu-outline"></div>
<div class="menu-icon small"></div>
<div class="menu-icon large">
    <div></div>
</div>

<div class="nav-text homepage">Homepage</div>
<div class="nav-text library">Library</div>
<div class="nav-text account-top">Account</div>

<div class="separator-line line-1"></div>
<div class="separator-line line-2"></div>
<div class="separator-line line-3"></div>

<div class="account-block account-top-block"></div>
<div class="account-block account-bottom-block"></div>

<div class="account-title">account</div>
<div class="choose-text">CHOSE</div>
<div class="slip-text">slip</div>

<div class="profile-pic">
    <img src="https://placehold.co/43x43" />
</div>

</html>
