<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=/">
  <title>Logout Successful - TVaporr</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100%;
      background: linear-gradient(180deg, #E6C000 14%, #5D110D 66%, #480E0C 78%, #340C0A 90%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .message-container {
      background: #350B09;
      border-radius: 12px;
      padding: 40px;
      width: 500px;
      max-width: 90%;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.8s ease forwards;
    }
    
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    
    p {
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .redirect-button {
      background-color: #CF514C;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    .redirect-button:hover {
      background-color: #e76b6b;
    }
    
    .countdown {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
    
    .success-icon {
      font-size: 48px;
      margin-bottom: 20px;
      color: #4CAF50;
    }
    
    .status-code {
      display: inline-block;
      background: #4CAF50;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 5px;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="message-container">
    <div class="success-icon">✓</div>
    <h1>Logout Successful!</h1>
    <p>You have been successfully logged out. <span class="status-code">200</span></p>
    <p>Thank you for using TVaporr!</p>
    <button class="redirect-button" onclick="window.location.href='/'">Go to Login!</button>
    <p class="countdown">You will be redirected in <span id="timer">5</span> seconds...</p>
  </div>

  <script>
    // Countdown timer
    let timeLeft = 5;
    const timerElement = document.getElementById('timer');
    
    const countdown = setInterval(() => {
      timeLeft--;
      timerElement.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(countdown);
      }
    }, 1000);
  </script>
</body>
</html>
