      <div class="layout">

          <hr>
          <h2>All tags</h2>

            <label><input type="checkbox"> tags2</label>
          </div>
        </aside>
    
        <main class="main-content">
          <header class="navbar">
            <div class="nav-links">
              <a href="#">Homepage</a>
              <span>|</span>
              <a href="/library">Library</a>
            </div>
            <div class="account">
              <div class="account-container" id="account-container">
                <img id="user-profile-photo" src="https://placehold.co/30x30" alt="Profile Icon" style="width: 32px; height: 32px; object-fit: fill;">
                <span id="user-display-name">Loading...</span>
                <div class="account-dropdown" id="account-dropdown">
                  <a href="/csetting" class="dropdown-item">Settings</a>
                  <a href="/logout" class="dropdown-item">Logout</a>
                </div>
              </div>
            </div>
          </header>          
          <section class="hero" id="banner-carousel">
            <div class="banner-container">
              <img id="banner-image" class="banner-image" src="" alt="Game Banner">
              <div class="banner-controls">
                <button id="prev-banner" class="banner-control">&lt;</button>
                <div id="banner-indicators" class="banner-indicators"></div>
                <button id="next-banner" class="banner-control">&gt;</button>
              </div>
              <div id="banner-loading" class="banner-loading">Loading banners...</div>
            </div>
          </section>
    
          <div class="search-section">
            <input type="text" placeholder="Search...">
            <button>🔍</button>
          </div>          <section class="cards-container">
            <div class="cards" id="game-cards">
              <!-- Games will be loaded here dynamically -->
            </div>
          </section>
        </main>
      </div> 
    
</body>

<script>  document.addEventListener('DOMContentLoaded', function() {
    // Fetch games from API
    fetchGames();
    
    // Initialize banner carousel
    initBannerCarousel();
    
    // Initialize account dropdown
    initAccountDropdown();

    const searchInput = document.querySelector('.search-section input');
    const searchButton = document.querySelector('.search-section button');

    // Function to perform search
    function performSearch() {
      const searchQuery = searchInput.value.trim();
      if (searchQuery) {
        searchGames(searchQuery);
      } else {
        fetchGames();
      }
    }

    // Add event listener for search button
    searchButton.addEventListener('click', performSearch);
    
    // Add event listener for Enter key in search input
    searchInput.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault(); // Prevent form submission
        performSearch();
      }
    });
  });
    // Account dropdown functionality
  function initAccountDropdown() {
    const accountContainer = document.getElementById('account-container');
    const accountDropdown = document.getElementById('account-dropdown');
    const userDisplayName = document.getElementById('user-display-name');
    const userProfilePhoto = document.getElementById('user-profile-photo');
    
    // Toggle dropdown when clicking on account
    accountContainer.addEventListener('click', function(e) {
      e.stopPropagation(); // Prevent event from bubbling to document
      accountDropdown.classList.toggle('show');
    });
    
    // Close dropdown when clicking elsewhere on the page
    document.addEventListener('click', function() {
      accountDropdown.classList.remove('show');
    });
    
    // Fetch user information and update display
    fetchUserInfo();
    
    // Function to fetch user information
    function fetchUserInfo() {
      // Get user ID from session storage or cookies, simulating with a fixed ID for now
      // In a real app, you would use a proper authentication system
      const userId = getUserIdFromStorage();
      
      if (!userId) {
        console.log('User not logged in');
        return;
      }
      
      // Fetch user profile data
      fetch(`http://localhost:8080/api/customers/id=${userId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to fetch user data');
          }
          return response.json();
        })
        .then(userData => {
          userData = userData.user
          console.log('User data:', userData);
          // Update display name
          if (userData.dName != null) {
            userDisplayName.textContent = userData.dName;
          }
          else if (userData.uName != null) {
            userDisplayName.textContent = userData.uName;
          }
          else{
            userDisplayName.textContent = "Unknown User";
          }
          
          // Load profile photo
          loadProfilePhoto(userId);
        })
        .catch(error => {
          console.error('Error fetching user data:', error);
        });
    }
    
    // Function to load user profile photo
    function loadProfilePhoto(userId) {
      // Set photo URL
      const photoUrl = `http://localhost:8080/api/customers/id=${userId}/photo`;
      
      // Create a new image to test if the URL is valid
      const testImg = new Image();
      testImg.onload = function() {
        // If image loads successfully, update the profile photo
        userProfilePhoto.src = photoUrl;
      };
      testImg.onerror = function() {
        // If image fails to load, keep the default image
        console.log('Failed to load profile photo, using default');
      };
      
      // Start loading the image
      testImg.src = photoUrl;
    }
    
    // Function to get user ID from storage
    function getUserIdFromStorage() {
      // Try to get from sessionStorage first
      const userId = sessionStorage.getItem('userId') || localStorage.getItem('userId');
      
      // If not found in storage, check URL parameters (for testing)
      if (!userId) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('userId') || '1'; // Default to ID 1 for testing if nothing found
      }
      
      return userId;
    }
  }

  // Banner carousel functionality
  function initBannerCarousel() {
    const MAX_BANNERS = 6; // Maximum number of banners to check
    const DISPLAY_TIME = 5000; // 5 seconds per banner
    let availableBanners = []; // Will store indices of banners that exist
    let currentBannerIndex = 0;
    let bannerInterval;
    let isAutoScrolling = true;
    
    const bannerImage = document.getElementById('banner-image');
    const prevButton = document.getElementById('prev-banner');
    const nextButton = document.getElementById('next-banner');
    const bannerIndicators = document.getElementById('banner-indicators');
    const loadingElement = document.getElementById('banner-loading');

    // Check which banner indices actually have images
    async function checkAvailableBanners() {
      loadingElement.style.display = 'flex'; // Show loading indicator
      
      // Array to store all our fetch promises
      const fetchPromises = [];
      
      for (let i = 1; i <= MAX_BANNERS; i++) {
        // Create a promise for each banner check
        const promise = fetch(`http://localhost:8080/api/games/banner/${i}`)
          .then(response => {
            if (response.headers.get('content-type')?.includes('application/json')) {
              return response.json().then(data => {
                return { index: i, exists: data.success !== false };
              });
            }
            return { index: i, exists: response.ok };
          })
          .catch(() => {
            return { index: i, exists: false };
          });
          
        fetchPromises.push(promise);
      }
      
      // Wait for all promises to resolve
      const results = await Promise.all(fetchPromises);
      
      // Filter to only banners that exist
      availableBanners = results.filter(result => result.exists).map(result => result.index);
      
      if (availableBanners.length > 0) {
        // Create indicator dots for each banner
        bannerIndicators.innerHTML = '';
        availableBanners.forEach((_, index) => {
          const dot = document.createElement('div');
          dot.className = 'banner-dot';
          dot.dataset.index = index;
          dot.addEventListener('click', () => {
            showBanner(index);
            resetTimer();
          });
          bannerIndicators.appendChild(dot);
        });
        
        // Show the first banner without animation
        const bannerIndex = availableBanners[0];
        bannerImage.src = `http://localhost:8080/api/games/banner/${bannerIndex}`;
        
        // Update indicator for the first banner
        const dots = bannerIndicators.querySelectorAll('.banner-dot');
        if (dots.length > 0) {
          dots[0].classList.add('active');
        }
        
        // Start the auto scroll after the first banner has been displayed for DISPLAY_TIME
        setTimeout(() => {
          startAutoScroll();
        }, DISPLAY_TIME);
      } else {
        loadingElement.textContent = 'No banners available';
      }
      
      loadingElement.style.display = 'none'; // Hide loading indicator
    }
    
    function showBanner(index, direction = 'next') {
      if (availableBanners.length === 0) return;
      
      // Store old index before updating
      const oldIndex = currentBannerIndex;
      
      // Update index
      currentBannerIndex = index;
      
      // Handle wrapping around the ends
      if (currentBannerIndex < 0) currentBannerIndex = availableBanners.length - 1;
      if (currentBannerIndex >= availableBanners.length) currentBannerIndex = 0;
      
      // If user clicked on the same banner, do nothing
      if (oldIndex === currentBannerIndex) return;
      
      const bannerIndex = availableBanners[currentBannerIndex];
      
      // Create a new image element for the incoming banner
      const newImage = document.createElement('img');
      newImage.className = 'banner-image';
      newImage.alt = "Game Banner";
      newImage.src = `http://localhost:8080/api/games/banner/${bannerIndex}`;
      
      // Position the new image off-screen based on direction
      const slideDirection = direction === 'next' ? '100%' : '-100%';
      newImage.style.position = 'absolute';
      newImage.style.transform = `translateX(${slideDirection})`;
      
      // Add the new image to the container
      const container = document.querySelector('.banner-container');
      container.appendChild(newImage);
      
      // Wait for new image to load
      newImage.onload = function() {
        // Once loaded, start animation
        setTimeout(() => {
          // Move the current image out in the opposite direction
          bannerImage.style.transition = 'transform 500ms ease';
          bannerImage.style.transform = `translateX(${direction === 'next' ? '-100%' : '100%'})`;
          
          // Move the new image to center
          newImage.style.transition = 'transform 500ms ease';
          newImage.style.transform = 'translateX(0)';
          
          // After animation completes, replace old banner with new one
          setTimeout(() => {
            // Replace the main banner image source
            bannerImage.src = newImage.src;
            
            // Reset the styles on the main banner image without transition
            bannerImage.style.transition = 'none';
            bannerImage.style.transform = 'translateX(0)';
            
            // Remove the temporary image
            container.removeChild(newImage);
          }, 500);
        }, 50);
      };
      
      // Update indicator dots
      const dots = bannerIndicators.querySelectorAll('.banner-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentBannerIndex);
      });
    }
    
    function nextBanner() {
      showBanner(currentBannerIndex + 1, 'next');
    }
    
    function prevBanner() {
      showBanner(currentBannerIndex - 1, 'prev');
    }
    
    function startAutoScroll() {
      if (bannerInterval) clearInterval(bannerInterval);
      bannerInterval = setInterval(() => {
        if (isAutoScrolling) nextBanner();
      }, DISPLAY_TIME);
    }
    
    function resetTimer() {
      if (bannerInterval) clearInterval(bannerInterval);
      startAutoScroll();
    }
    
    // Event listeners for controls
    prevButton.addEventListener('click', () => {
      prevBanner();
      resetTimer();
    });
    
    nextButton.addEventListener('click', () => {
      nextBanner();
      resetTimer();
    });
    
    // Pause auto-scroll when hovering over the banner
    bannerImage.addEventListener('mouseenter', () => {
      isAutoScrolling = false;
    });
    
    bannerImage.addEventListener('mouseleave', () => {
      isAutoScrolling = true;
      resetTimer();
    });

    // Handle image load error
    bannerImage.addEventListener('error', () => {
      // If an image fails to load, try the next one
      nextBanner();
      resetTimer();
    });
    
    // Initialize by checking available banners
    checkAvailableBanners();
  }

  // Function to fetch all games
  function fetchGames() {
    fetch('http://localhost:8080/api/games/search/all')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(games => {
        displayGames(games);
      })
      .catch(error => {
        console.error('Error fetching games:', error);
        displayError('Failed to load games. Please try again later.');
      });
  }
  // Function to search games
  function searchGames(query) {
    // First, try to use server-side search if the API supports it
    fetch(`http://localhost:8080/api/games/search/all?q=${encodeURIComponent(query)}`)
      .then(response => {
        if (!response.ok) {
          // If server doesn't support search parameter, fallback to client-side filtering
          return fetch('http://localhost:8080/api/games/search/all')
            .then(resp => resp.json())
            .then(allGames => {
              // Filter games by name on the client side
              const filteredGames = allGames.filter(game => 
                game.gName && game.gName.toLowerCase().includes(query.toLowerCase())
              );
              displayGames(filteredGames);
            });
        }
        return response.json();
      })
      .then(games => {
        // Only execute this if we got a successful server-side search
        if (games) displayGames(games);
      })
      .catch(error => {
        console.error('Error searching games:', error);
        // Fallback to getting all games
        fetchGames();
      });
  }
  // Function to display games in the cards section
  function displayGames(games) {
    const cardsContainer = document.getElementById('game-cards');
    cardsContainer.innerHTML = ''; // Clear existing cards
    
    if (!games || games.length === 0) {
      cardsContainer.innerHTML = '<p class="no-games">No games found</p>';
      return;
    }

    // Create card for each game
    games.forEach(game => {
      const card = document.createElement('div');
      card.className = 'card game-card';
      
      // Create card content
      let imageHtml = '';
      // Check for picture1 in the response
      if (game.picture1) {
        // Construct the image URL based on gameID
        const imageUrl = `http://localhost:8080/api/games/banner/${game.gameID}`;
        imageHtml = `<img src="${imageUrl}" alt="${game.gName}" class="game-image">`;
      } else {
        // Apply gray background for games without images
        card.classList.add('no-image');
        // Add a text element showing the game has no image
        imageHtml = `<div class="no-image-text">No Picture</div>`;
      }
      
      card.innerHTML = `
        ${imageHtml}
        <div class="game-info">
          <h3 class="game-title">${game.gName || 'Unknown Game'}</h3>
          <p class="game-price">${formatPrice(game.gPrice)}</p>
        </div>
      `;
      
      // Add click event to navigate to game details
      card.addEventListener('click', function() {
        window.location.href = `/BUYPAGE.html?id=${game.gameID}`;
      });
      
      cardsContainer.appendChild(card);
    });
  }

  // Helper function to display error message
  function displayError(message) {
    const cardsContainer = document.getElementById('game-cards');
    cardsContainer.innerHTML = `<p class="error-message">${message}</p>`;
  }
  // Helper function to format price
  function formatPrice(price) {
    if (price === undefined || price === null) return 'Free';
    return `$${parseFloat(price).toFixed(2)}`;
  }
</script>
