<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVaporr</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <main class="main-content">
            <header class="navbar">
              <div class="nav-links">
                <a href="#">Homepage</a>
                <span>|</span>
                <a href="#">Library</a>
              </div>
              <div class="account">
                <img src="https://placehold.co/30x30" alt="Profile Icon">
                <span>Account</span>
              </div>
            </header>
      

            </section>
          </main>
    </div>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100%;
            background: linear-gradient(270deg, #471C1A 32%, #9F3E3A 70%, #C9A24E 99%);
        }
        .account {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #471C1A;
        }
        .layout {
            display: flex;
            height: 100vh;
        }
        .topbar {
            width: 1920px;
            height: 84px;
            background: #350B09;
            position: absolute;
            top: 73px;
            left: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #230706;
            color: white;
            padding: 0 30px;
            height: 60px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 20px;
        }
        
        
    </style>
</body>
</html>
