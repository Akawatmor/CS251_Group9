<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login to TVaporr</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Poppins&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #E6C000 0%, #5D110D 66%, #480E0C 78%, #340C0A 100%);
      overflow: hidden;
      position: relative;
    }

    .background-img {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('./PICTURE/LOGIN_BG1.png') no-repeat center;
      background-size: 100% 100%;
      opacity: 0.9;
      z-index: 0;
    }

    .login-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #350B09;
      border-radius: 15px;
      padding: 30px;
      width: 650px;
      max-width: 95%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .login-container h1 {
      color: white;
      text-align: center;
      font-size: 42px;
      margin-top: 0;
      margin-bottom: 30px;
    }

    .login-content {
      display: flex;
      justify-content: space-between;
    }

    .form-section {
      flex: 2;
      display: flex;
      flex-direction: column;
    }

    label {
      color: white;
      font-size: 18px;
      margin-bottom: 6px;
    }

    input {
      background: #6A3C3A;
      border: none;
      border-radius: 8px;
      height: 40px;
      color: white;
      font-size: 16px;
      padding: 0 15px;
      margin-bottom: 20px;
      width: 100%;
    }

    .login-btn {
      background-color: #CF514C;
      color: white;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      cursor: pointer;
      margin-top: 10px;
      width: 150px;
      align-self: center;
      position: relative;
      transition: background-color 0.3s;
    }

    .login-btn:disabled {
      background-color: #a3413d;
      cursor: not-allowed;
    }

    .login-btn .spinner {
      display: none;
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 15px;
      margin-top: -10px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-btn.loading .spinner {
      display: inline-block;
    }

    .login-btn.loading {
      padding-left: 40px;
    }

    .register-text {
      color: white;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .register-link {
      color: #CF514C;
      text-decoration: none;
      cursor: pointer;
      margin-left: 5px;
    }

    .qr-section {
      flex: 1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      /*font-size: 32px;*/
      color: black;
      width: 200px;
      height: 200px;
      margin-left: 20px;
      padding-left: auto;
    }

    .qr-section img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
    }

    .loginQrCode {
      position: absolute;
      bottom: 90px;
      padding-left: 5px;
      left: 70%;
      font-size: 14px;
      color: white;
      text-align: right;
      
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -60%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    @media screen and (max-width: 768px) {
      .login-container {
        width: 90%;
        padding: 20px;
      }

      .login-content {
        flex-direction: column;
      }

      .qr-section {
        margin-left: 0;
        margin-top: 20px;
        width: 100%;
      }
    }
  </style>
</head>

<body onload="generateQRCode()">
  <div class="background-img"></div>
  <div class="alert" id="errorMsg" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #f44336; color: white; padding: 15px; border-radius: 5px; z-index: 100; opacity: 0; transition: opacity 0.3s;">
    <span id="errorText"></span>
  </div>

  <div class="login-container">
    <h1>TVaporr</h1>
    <div class="login-content">
      <div class="form-section">
        <label for="username">username</label>
        <input type="text" name="user" id="username" placeholder="Enter username" />
        <label for="password">password</label>
        <input type="password" name="pass" id="password" placeholder="Enter password" />
        <div class="register-text">Don't have user? <a href="/register" class="register-link">Register Now</a></div>
        <button type="button" id="loginBtn" class="login-btn">
          <div class="spinner"></div>
          <span>Login</span>
        </button>
      </div>

      <div class="qr-section" id="qrCodeContainer">
        <!-- <img src="" alt="QR Code" id="qrCodeImage"> -->
      </div>
      <!-- <div class="loginQrCode">Login with QR Code</div> -->
    </div>
  </div>

<script>
function showError(message) {
  const errorDiv = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  errorText.textContent = message;
  errorDiv.style.display = 'block';
  errorDiv.style.opacity = '1';
  
  setTimeout(() => {
    errorDiv.style.opacity = '0';
    setTimeout(() => {
      errorDiv.style.display = 'none';
    }, 300);
  }, 3000);
}

function generateQRCode() {
  fetch("/service/login/qrcode-login")
    .then((res) => res.json())
    .then((data) => {
      const qrCodeContainer = document.getElementById("qrCodeContainer");
      qrCodeContainer.innerHTML = `
        <img src="${data.qrCode}" alt="QR Code">
        <div class="loginQrCode">Login with QR Code</div>
      `;
    })
    .catch((err) => {
      console.error("Error generating QR code", err);
      const qrCodeContainer = document.getElementById("qrCodeContainer");
      qrCodeContainer.innerHTML = ""; // Clear the container if there's an error
    });
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const loginBtn = document.getElementById('loginBtn');
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  
  if (!user || !pass) {
    showError('Username and password are required');
    return;
  }

  try {
    // Disable button and show loading state
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    
    const res = await fetch('/service/login/authen', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ user, pass })
    });

    if (!res.ok) {
      throw new Error(`HTTP error! Status: ${res.status}`);
    }

    const data = await res.json();
    
    if (data.success) {
      // Store user ID in localStorage if it's returned in the response
      if (data.id) {
        localStorage.setItem('userId', data.id);
      }
      
      // Redirect based on user type
      window.location.href = data.redirectUrl || "/home";
    } else {
      showError(data.message || 'Login failed. Please try again.');
      // Re-enable button and hide loading state
      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');
    }
  } catch (error) {
    console.error('Login error:', error);
    showError('An error occurred during login. Please try again later.');
    // Re-enable button and hide loading state
    loginBtn.disabled = false;
    loginBtn.classList.remove('loading');
  }
});
</script>
</body>
</html>
