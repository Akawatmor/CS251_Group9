<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dev3</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="layout">
    <aside class="sidebar">
      <div class="logo"><a href="#">&#8592;</a></div>
      <div class="tags">
        <a href="#">Store</a><hr>
        <a href="#">Game </a><hr>
        <a href="#">Pricing</a><hr>
        <a href="#">Contract us</a><hr>
      </div>
    </aside>
    <div class="mainbar">
      <form>
        <p><label for="">Pricing</label></p>
        <input type="text" required>
        <br>
      </form>
    
      <form id="eventPricingForm">
        <p><label for="">Pricing in Event</label></p>
        <div id="eventPricingContainer">
        </div>
        <button type="button" id="addPricingBtn">+ Add Pricing</button>
        <br>
      </form>
    
      <br>
      <div class="button-wrapper">
        <button type="submit">Apply</button>
      </div>
    </div>
  
</body>

<style>

body, html {
margin: 0;
padding: 0;
font-family: 'Poppins', sans-serif;
height: 100%;
background: #6A3C3A;
}

.layout {
display: flex;
height: 100vh;
}

.sidebar {
background: linear-gradient(180deg, #350B09 67%, #471C1A 100%);
color: white;
width: 250px;
padding: 20px;
display: flex;
flex-direction: column;
gap: 20px;
}

.mainbar {
color: white;
padding: 40px;
flex-direction: column;
gap: 20px;
text-decoration: none;
width: 75%;
}

.mainbar textarea{
background-color: #471C1A;
width: 100%;
height: 80px;
}

.mainbar input{
background-color: #471C1A;
color: white;
padding: 8px 16px;
display: inline-block;
cursor: pointer;
}

.button-wrapper {
display: flex;
justify-content: flex-end; 
margin-top: auto;
}
.mainbar button {
background-color: #471C1A;
color: white;
width: 150px;        
height: 45px;        
font-size: 18px;     
padding: 10px 20px;  
border: none;
cursor: pointer;
}

#addPricingBtn {
  margin-top: 10px;
  background-color: #471C1A;
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.event-pricing-entry {
  margin-bottom: 10px;
}

.event-pricing-entry input {
  margin-right: 10px;
  padding: 5px;
  width: 120px;
}

.removePricingBtn {
  background-color: #9c2b2b;
  color: white;
  border: none;
  padding: 5px 10px;
  margin-left: 10px;
  cursor: pointer;
  border-radius: 4px;
}

.logo {
  font-size: 32px;
}

.sidebar hr {
  border: 0;
  border-top: 1px solid white;
  margin: 10px 0;
}

.sidebar h2 {
  font-size: 20px;
}
.sidebar a {
  text-decoration: none;
  color: white;
}
.tags label {
  display: block;
  margin-top: 10px;
  font-size: 16px;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: url('https://i.ibb.co/7z1RVtk/dots-bg.png') no-repeat center/cover;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #230706;
  color: white;
  padding: 0 30px;
  height: 60px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 15px;
}

.nav-links a {
  text-decoration: none;
  color: white;
  font-size: 20px;
}

.account {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero {
  background-color: rgba(255, 255, 255, 0.1);
  margin: 20px;
  height: 250px;
  border-radius: 8px;
}

.search-section {
  display: flex;
  align-items: center;
  margin: 0 20px 20px 20px;
}

.search-section input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

.search-section button {
  padding: 10px 15px;
  font-size: 20px;
  background-color: #471C1A;
  color: white;
  border: none;
  cursor: pointer;
}

.cards {
  display: flex;
  gap: 20px;
  margin: 0 20px;
}

.card {
  flex: 1;
  background-color: rgba(255, 255, 255, 0.1);
  height: 200px;
  border-radius: 8px;
}
</style>
<script>
  const container = document.getElementById('eventPricingContainer');
  const addBtn = document.getElementById('addPricingBtn');

  addBtn.addEventListener('click', () => {
    const entry = document.createElement('div');
    entry.className = 'event-pricing-entry';

    entry.innerHTML = `
      <input type="date" name="eventDate[]" required>
      <input type="time" name="eventTime[]" required>
      <input type="number" name="eventPrice[]" placeholder="Price" required>
      <button type="button" class="removePricingBtn">x</button>
    `;

    container.appendChild(entry);
  });

  // Use event delegation to handle remove clicks
  container.addEventListener('click', (e) => {
    if (e.target && e.target.classList.contains('removePricingBtn')) {
      e.target.parentElement.remove(); // remove the whole row
    }
  });
</script>

</html>
