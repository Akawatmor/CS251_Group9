#Setup
spring.application.name=backend
spring.datasource.driver-class-name =com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://petchsko123.trueddns.com:56268/CS251Group9Database?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=DatabaseEditUser
spring.datasource.password=CS251Group9DatabaseEdit

spring.jpa.show-sql: true

spring.jpa.hibernate.ddl-auto=update

# Keep connections alive with periodic testing
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.keepalive-time=30000

# Set appropriate pool sizes
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5

# Tune timeouts
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
logging.level.com.zaxxer.hikari=DEBUG

# Statement caching
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=./uploads/
